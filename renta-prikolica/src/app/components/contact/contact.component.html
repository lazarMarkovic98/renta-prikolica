<section id="kontakt" class="contact-section">
  <div class="container">
    <div class="contact-wrapper">
      <div class="contact-info">
        <span class="section-tag">Kontakt</span>
        <h2>Rezervišite Prikolicu</h2>
        <p>Ispunite formu i kontaktiraćemo Vas u roku od 1 sata da potvrdimo rezervaciju.</p>
        <div class="info-list">
          <div class="info-item" *ngFor="let item of contactInfo">
            <span class="info-icon">{{ item.icon }}</span>
            <div>
              <strong>{{ item.label }}</strong>
              <a *ngIf="item.isLink" [href]="item.href">{{ item.value }}</a>
              <span *ngIf="!item.isLink">{{ item.value }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="contact-form-wrap map-wrap">
        <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d718.7178575822707!2d21.53225652856992!3d43.89992949818574!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4756bd82f2da25f1%3A0x6a232e0a435f2f2c!2sIznajmljivanje%20auto%20prikolica%20Para%C4%87in!5e0!3m2!1sen!2srs!4v1777977559884!5m2!1sen!2srs" 
        width="600" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

    </div>
  </div>
</section>
