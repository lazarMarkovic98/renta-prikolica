<section id="galerija" class="photos-section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Galerija</span>
      <h2>Prikolice u Akciji</h2>
      <p>Pogledajte kako naše prikolice rade — na putevima u inostranstvu, napunjene teretom i sa zadovoljnim korisnicima.</p>
    </div>

    <div class="photos-grid">
      <div
        class="photo-card"
        *ngFor="let photo of visiblePhotos"
        (click)="openLightbox(photo.src)"
        tabindex="0"
        role="button"
        (keydown.enter)="openLightbox(photo.src)"
        [attr.aria-label]="'Uvećaj sliku'"
      >
        <img [src]="photo.src" loading="lazy" />
        <div class="photo-overlay"><span>🔍</span></div>
      </div>
    </div>

    <div class="photos-actions" *ngIf="canLoadMore">
      <button type="button" class="btn-load-more" (click)="loadMore()">Prikaži još</button>
    </div>
  </div>

  <div class="lightbox-overlay" *ngIf="lightboxSrc" (click)="closeLightbox()">
    <button type="button" class="lightbox-close" (click)="closeLightbox()" aria-label="Zatvori">×</button>
    <img [src]="lightboxSrc" (click)="$event.stopPropagation()" />
  </div>
</section>
